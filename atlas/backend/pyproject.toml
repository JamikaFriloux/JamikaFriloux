[project]
name = "atlas"
version = "0.1.0"
description = "ATLAS - Autonomous Trading & Learning Analysis System (paper trading only)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "redis>=5.0",
    "celery>=5.4",
    "alpaca-py>=0.43",
    "httpx>=0.27",
    "pyjwt>=2.9",
    "argon2-cffi>=23.1",
    "pyyaml>=6.0",
    "structlog>=24.4",
    "exchange-calendars>=4.5",
    "pandas>=2.2",
    "numpy>=2.0",
    "anthropic>=0.40",
    "sentry-sdk>=2.14",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
    "types-redis",
    "pip-audit>=2.7",
    "fakeredis>=2.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["atlas"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "DTZ", "RUF"]
ignore = ["S101", "RUF012", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "S311", "DTZ001"]
"migrations/**" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires PostgreSQL (ATLAS_TEST_DATABASE_URL)",
]
filterwarnings = ["ignore::DeprecationWarning:celery.*"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
