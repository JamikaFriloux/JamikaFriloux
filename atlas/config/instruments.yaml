# Instrument reference data, reviewed like policy.yaml (Phase 7).
#
# * etfs: exchange-traded funds. Funds don't report earnings, so the earnings blackout
#   doesn't apply to them. `sector` is the exposure bucket used by the per-sector limit
#   (max_sector_exposure_pct); funds tracking the same market share a bucket.
# * stocks: sector overrides (GICS sector names). A provider (SEC EDGAR SIC codes) may fill
#   in other stocks; entries here take precedence.
# * Anything not listed and not classified by a provider is "unknown": it has no earnings
#   clearance (entries fail closed) and all unknown holdings share one sector bucket.
#
# Review this file when adding watchlist symbols. Classifications change rarely (GICS
# reshuffles, ETF strategy changes); re-check yearly.
version: 1

etfs:
  SPY:  {sector: us_equity_broad, name: SPDR S&P 500 ETF Trust}
  IVV:  {sector: us_equity_broad, name: iShares Core S&P 500 ETF}
  VOO:  {sector: us_equity_broad, name: Vanguard S&P 500 ETF}
  QQQ:  {sector: us_equity_broad, name: Invesco QQQ Trust (Nasdaq-100)}
  DIA:  {sector: us_equity_broad, name: SPDR Dow Jones Industrial Average ETF}
  IWM:  {sector: us_equity_broad, name: iShares Russell 2000 ETF}
  TQQQ: {sector: us_equity_broad, name: ProShares UltraPro QQQ (3x Nasdaq-100), leveraged: true}
  SMH:  {sector: semiconductors, name: VanEck Semiconductor ETF}
