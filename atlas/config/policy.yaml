# ATLAS risk & trading policy — PAPER TRADING environment.
#
# These are conservative engineering defaults for simulation, NOT guarantees of safety.
# The risk engine enforces these values deterministically; no LLM or agent can change them
# at runtime. Edits require a code-reviewed commit and a service restart. The loaded file's
# SHA-256 is written to the audit log on every startup.
#
# Values are also bounded by hard ceilings in
# backend/atlas/core/configuration/policy.py (HARD_LIMITS). A file that exceeds a ceiling
# is rejected at startup.

version: 1
trading_mode: paper

account:
  starting_equity_usd: 10000

instruments:
  allowed_asset_classes: [us_equity]   # stocks and ETFs
  long_only: true
  allow_short_selling: false
  allow_margin: false
  allow_leverage: false
  allow_options: false
  allow_crypto: false
  allow_otc: false
  min_price_usd: 10.0
  min_avg_daily_dollar_volume_usd: 20000000
  max_spread_bps: 25

session:
  regular_hours_only: true
  no_new_positions_minutes_after_open: 5
  no_new_positions_minutes_before_close: 15
  block_entries_before_earnings_days: 2

limits:
  max_risk_per_trade_pct: 0.25         # % of current equity at risk (entry - stop) per trade
  max_daily_loss_pct: 1.0              # % of starting-day equity
  max_drawdown_pct: 5.0                # % from high-water mark
  drawdown_cooldown_sessions: 20       # after a halt: no entries for 20 sessions, then the HWM resets
  max_position_allocation_pct: 10.0    # % of equity per position
  max_concurrent_positions: 5
  max_sector_exposure_pct: 25.0
  max_gross_exposure_pct: 50.0
  max_new_trades_per_day: 5
  max_order_notional_usd: 1000
  min_cash_buffer_usd: 100

data_quality:
  max_quote_age_seconds: 15
  max_bar_age_seconds: 120
  reject_on_missing_data: true

execution:
  default_order_type: limit
  limit_offset_bps: 5
  stop_slippage_assumption_bps: 20
  order_time_in_force: day

# Validation backtests (Phase 4). Costs are charged on every simulated fill so a strategy can't
# look profitable only because trading was free. Floors in policy.py stop these from being
# set unrealistically low. Regulatory fee rates change; review them yearly.
backtest:
  half_spread_bps: 2.0              # paid on each fill (crossing half the bid/ask spread)
  slippage_bps: 5.0                 # extra adverse price per fill (impact, timing)
  sec_fee_per_million_usd: 27.80    # SEC Section 31 fee on sell notional
  finra_taf_per_share: 0.000166     # FINRA trading activity fee on sells...
  finra_taf_max_per_trade_usd: 8.30 # ...capped per trade
  max_participation_pct: 1.0        # an order fills at most this % of the session's volume

# RESEARCH -> PAPER promotion gates. A strategy version is promotable only with a passing
# validation report no older than report_max_age_days. Proposed defaults: review them.
promotion_gates:
  min_history_years: 8              # backtest span required
  min_trades: 100                   # over the full span
  min_profit_factor: 1.2            # gross wins / gross losses, after costs
  min_sharpe: 0.5                   # annualized, daily returns, after costs
  max_drawdown_pct: 10.0            # peak-to-trough equity drawdown
  holdout_years: 2                  # most recent years, judged on their own
  holdout_min_trades: 20
  holdout_min_sharpe: 0.0
  walk_forward_window_months: 12    # consecutive out-of-sample windows...
  min_profitable_windows_pct: 60.0  # ...this share must be profitable
  min_stable_neighbors_pct: 70.0    # parameter neighbors that must also be profitable
  bootstrap_samples: 2000
  bootstrap_confidence: 0.95        # lower bound of mean trade return must exceed 0
  report_max_age_days: 90

# PAPER -> LIVE_CANDIDATE gates (Phase 6), judged on the strategy's own paper-trading record
# since its latest promotion to PAPER. LIVE_CANDIDATE keeps paper trading and can never submit
# live orders in this deployment. Proposed defaults: review them.
track_record_gates:
  min_paper_sessions: 60            # sessions since promotion to PAPER
  min_paper_trades: 20              # closed round trips
  min_profit_factor: 1.1            # gross wins / gross losses
  max_drawdown_pct: 10.0            # of the policy budget, on cumulative realised P&L
  min_expectancy_vs_backtest: 0.5   # paper avg R must reach this share of the backtest's avg R
  record_max_age_days: 7            # an evaluation older than this can't justify promotion
